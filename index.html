<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Novel Translator</h1>
        <textarea id="inputText" placeholder="Masukkan teks novel di sini..."></textarea>
        <button id="translateBtn">Terjemahkan</button>
        <div class="output">
            <h2>Hasil Terjemahan:</h2>
            <p id="outputText"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
